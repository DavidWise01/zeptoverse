name: Zeptoverse kernel invariants
on:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel-tests.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: NCI-013 lineage and ice-rule invariants
        run: node kernel/nci-013.test.mjs
      - name: NCI-014 selection and counterexample invariants
        run: node kernel/nci-014.test.mjs
      - name: NCI-015 proton-network and loop invariants
        run: node kernel/nci-015.test.mjs
      - name: NCI-016 reversible state and memory invariants
        run: node kernel/nci-016.test.mjs
      - name: NCI-017 policy-memory and physical-state separation
        run: node kernel/nci-017.test.mjs
      - name: NCI-018 bounded policy adaptation and conserved trials
        run: node kernel/nci-018.test.mjs
      - name: NCI-019 structural transfer and shared-root de-duplication
        run: node kernel/nci-019.test.mjs
      - name: NCI-020 balanced ternary, local conservation, and recursive foam
        run: node kernel/nci-020.test.mjs
      - name: NCI-021 dimensioned Casimir energy and signed-boundary invariants
        run: node kernel/nci-021.test.mjs
      - name: NCI-022 triadic boundaries and single-ledger conservation
        run: node kernel/nci-022.test.mjs
      - name: NCI-023 thermoelectric work, heat and entropy
        run: node kernel/nci-023.test.mjs
      - name: NCI-024 finite-reservoir homeostasis and reversible evidence
        run: node kernel/nci-024.test.mjs
      - name: NCI-025 hysteretic prediction, policy memory and entropy
        run: node kernel/nci-025.test.mjs
